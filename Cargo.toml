[package]
publish = false
name = "silvae-os"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["builder"]

[dependencies]
bootloader_api = "=0.11.4"
x86_64 = "0.14.11"
pic8259 = "0.10.1"
spin = "0.9.8"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
linked_list_allocator = "0.10.5"
uart_16550 = "0.2.19"

[dependencies.smoltcp]
version = "0.8.2"
default-features = false
features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-icmp"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
